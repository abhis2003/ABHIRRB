name: Build Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Put web page and icons in place
        run: |
          mkdir -p www assets
          if [ -f app.html ]; then cp app.html www/index.html; else cp "$(ls *.html | head -n 1)" www/index.html; fi
          cp icon-only.png icon-foreground.png icon-background.png assets/
      - name: Use the same signing key every time
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - run: npm install --no-audit --no-fund
      - run: npx cap add android
      - name: Make app icons
        run: npx --yes @capacitor/assets@3.0.5 generate --android
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: RRB-Prep-Desk-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
