function render(){const root=$('#root');const views={dashboard:vDash,study:vStudy,practice:vPractice,mocks:vMocks,revise:vRevise,tracker:vTracker,planner:vPlanner,tutor:vTutor,guide:vGuide};
 const ml=ui.cur&&ui.tab!=='mocks'?'<div class="notice" style="margin-bottom:14px">A mock is in progress. <button class="btn sm pri" data-act="tab" data-id="mocks">Return to mock</button></div>':'';
 root.innerHTML=`<div class="top"><div class="brand"><b>RRB Prep Desk</b><span>IBPS RRB PO and Clerk</span></div><button class="btn sm" data-act="theme" aria-label="Switch theme">Switch theme</button></div>
 <nav class="tabs" aria-label="Sections">${TABS.map(([id,n])=>`<button class="tab ${ui.tab===id?'on':''}" data-act="tab" data-id="${id}">${n}</button>`).join('')}</nav>${ml}<main>${views[ui.tab]()}</main>`;
 tick()}
function go(t){ui.tab=t;try{if(location.hash!=='#'+t)history.replaceState(null,'','#'+t)}catch(e){}render();window.scrollTo(0,0)}
function openLesson(id){const l=LB[id];if(!l)return;ui.st={sec:l.sec,id,ex:null};go('study')}
function buildQs(spec,seed){const R=G.RNG(seed||Date.now()%1e9);let qs=[];spec.forEach(s=>{qs=qs.concat(G.genQuestions(s.t,s.n,R))});return qs}
function startPractice(spec){const qs=buildQs(spec);if(!qs.length){toast('No questions available for this choice');return}ui.pr.run={qs,i:0,sel:null,res:[],t0:Date.now(),qt:Date.now()};go('practice')}
function spread(topics,n){const k=topics.length,base=Math.floor(n/k),ex=n%k;return topics.map((t,i)=>({t,n:base+(i<ex?1:0)})).filter(x=>x.n>0)}
function startMock(kind,seed,sec,name){const m=G.buildMock(kind,seed,sec);const now=Date.now();ui.cur={name,kind,dur:m.dur,start:now,qs:m.qs,resp:m.qs.map(()=>({s:null,m:0,t:0,v:0})),i:0,ts:now};ui.cur.resp[0].v=1;ui.result=null;ui.mk.confirm=false;persistCur();go('mocks')}
function persistCur(){S.cur=ui.cur;save()}
function goQ(i){const c=ui.cur,n=Date.now();c.resp[c.i].t+=(n-c.ts)/1000;c.ts=n;c.i=i;c.resp[i].v=1;ui.mk.confirm=false;persistCur();render()}
function finishMock(){const c=ui.cur,n=Date.now();c.resp[c.i].t+=(n-c.ts)/1000;let correct=0,wrong=0,skip=0;const sec={},topics={};
 c.qs.forEach((q,i)=>{const r=c.resp[i],sc=sec[q.s]||(sec[q.s]={c:0,w:0,s:0,n:0,t:0}),tp=topics[q.t]||(topics[q.t]={c:0,w:0,s:0});sc.n++;sc.t+=r.t;
  if(r.s===null){skip++;sc.s++;tp.s++}else if(r.s===q.a){correct++;sc.c++;tp.c++;rec(q,true,r.t)}else{wrong++;sc.w++;tp.w++;rec(q,false,r.t)}});
 const used=Math.min(c.dur,Math.round((n-c.start)/1000)),sum={id:n,name:c.name,kind:c.kind,date:today(),score:correct-wrong*.25,max:c.qs.length,correct,wrong,skip,used,sec,topics};
 S.mocks.push(sum);dayRec().min+=Math.round(used/60);S.log.push({d:today(),sub:'Mock',min:Math.round(used/60)});ui.result={sum,qs:c.qs,resp:c.resp};ui.cur=null;S.cur=null;ui.mk.rf='wrong';ui.mk.confirm=false;save();render()}
function tick(){const c=ui.cur,e=$('#timer');if(c){const rem=Math.max(0,c.dur-(Date.now()-c.start)/1000);if(e){const m=Math.floor(rem/60),s=Math.floor(rem%60);e.textContent=pad(m)+':'+pad(s);e.classList.toggle('low',rem<300)}if(rem<=0)finishMock()}
 const sw=$('#swtime');if(sw&&ui.sw){const s=Math.floor((Date.now()-ui.sw.start)/1000);sw.textContent=pad(Math.floor(s/60))+':'+pad(s%60)}}
setInterval(tick,1000);

function handle(a,d,el){switch(a){
 case'tab':go(d.id);break;
 case'theme':{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('rrb.theme',r.dataset.theme)}catch(e){}break}
 case'task':{const p=S.plan[d.date]||(S.plan[d.date]={});p[d.k]=el.checked;save();render();break}
 case'taskgo':if(d.a==='lesson')openLesson(d.id);else if(d.a==='practice'){ui.pr.sec=LB[d.id].sec;ui.pr.sel={[d.id]:true};go('practice')}else if(d.a==='revise'){ui.rv.sub='nb';go('revise')}else if(d.a==='ca')openLesson('ca');else go(d.a);break;
 case'lesson':openLesson(d.id);break;
 case'stsec':ui.st.sec=d.id;ui.st.id=ids(d.id)[0];ui.st.ex=null;render();break;
 case'stopen':ui.st.id=d.id;ui.st.ex=null;render();break;
 case'learned':if(el.checked)S.learned[d.id]=1;else delete S.learned[d.id];save();render();break;
 case'example':{const q=G.genQuestions(d.id,1,G.RNG(Date.now()%1e9))[0];ui.st.ex=q;render();break}
 case'canote':{const i=$('#canote');if(i&&i.value.trim()){const x=$('#cadetail'),c=$('#cacat');S.notes.push({d:today(),w:weekOf(today()),c:c?c.value:'General',t:i.value.trim().slice(0,300),x:x?x.value.trim().slice(0,300):''});save();render()}break}
 case'cadel':S.notes.splice(+d.i,1);save();render();break;
 case'cawk':{ui.ca=ui.ca||{};const cur=weekOf(today());ui.ca.rv=null;if(d.w)ui.ca.w=d.w;else{const n=+d.n;ui.ca.w=n===0?cur:addDays(ui.ca.w||cur,7*n);if(ui.ca.w>cur)ui.ca.w=cur}render();break}
 case'cadone':{S.caweeks=S.caweeks||{};const w=ui.ca.w;if(S.caweeks[w])delete S.caweeks[w];else S.caweeks[w]=1;save();render();break}
 case'carvs':ui.ca.rv={i:0,show:false};render();break;
 case'carvf':ui.ca.rv.show=!ui.ca.rv.show;render();break;
 case'carvn':{const n=caItems(ui.ca.w).length;if(ui.ca.rv.i+1<n)ui.ca.rv={i:ui.ca.rv.i+1,show:false};else{ui.ca.rv=null;toast('Week reviewed. Mark it as reviewed when you are happy.')}render();break}
 case'carvx':ui.ca.rv=null;render();break;
 case'prsec2':ui.pr.sec=d.id;render();break;
 case'prsel':ui.pr.sel[d.id]=el.checked;break;
 case'prn':ui.pr.n=+el.value;break;
 case'prgo':{const t=Object.keys(ui.pr.sel).filter(k=>ui.pr.sel[k]&&G.has(k));if(!t.length){toast('Select at least one topic');break}startPractice(spread(t,ui.pr.n));break}
 case'prstart':{ui.pr.run=null;startPractice([{t:d.id,n:+d.n||10}]);break}
 case'prsec':{const t=ids(d.id).filter(G.has);startPractice(spread(t,20));break}
 case'prweak':startPractice(spread(weakTopics().slice(0,3).map(x=>x.id),15));break;
 case'prmix':{const R=G.RNG(Date.now()%1e9),pick=(a,n)=>R.shuffle(a).slice(0,n),q=pick(ids('Quant'),2),r=pick(ids('Reasoning'),2),x=pick([].concat(ids('English'),ids('GA'),ids('Computer')).filter(id=>id!=='ca'&&G.has(id)),1);
  startPractice(q.concat(r,x).map(t=>({t,n:4})));break}
 case'pans':{const r=ui.pr.run;if(r.sel!==null)break;const q=r.qs[r.i],i=+d.i,ok=i===q.a,t=(Date.now()-r.qt)/1000;r.sel=i;r.res.push({q,sel:i,ok,t});rec(q,ok,t);save();render();break}
 case'prskip':{const r=ui.pr.run;r.i++;r.sel=null;r.qt=Date.now();render();break}
 case'prnext':{const r=ui.pr.run;r.i++;r.sel=null;r.qt=Date.now();if(r.i>=r.qs.length)dayRec().min+=Math.max(1,Math.round((Date.now()-r.t0)/60000));save();render();break}
 case'prquit':ui.pr.run=null;render();break;
 case'mstart':startMock(d.kind,+d.seed,d.sec,d.name);break;
 case'msel':{const c=ui.cur;c.resp[c.i].s=+d.i;persistCur();render();break}
 case'mclear':{const c=ui.cur;c.resp[c.i].s=null;persistCur();render();break}
 case'mmark':{const c=ui.cur;c.resp[c.i].m=c.resp[c.i].m?0:1;goQ(Math.min(c.qs.length-1,c.i+1));break}
 case'mgo':goQ(+d.i);break;
 case'mask':ui.mk.confirm=true;render();break;
 case'mcancel':ui.mk.confirm=false;render();break;
 case'mfinish':finishMock();break;
 case'mdone':ui.result=null;render();break;
 case'mrf':ui.mk.rf=d.id;render();break;
 case'rvgo':ui.rv.sub=d.id;ui.rv.nb=null;ui.rv.fc=null;go('revise');break;
 case'nbstart':{ui.rv.nb={q:dueNB().slice(0,20),i:0,sel:null,ok:0};render();break}
 case'nbans':{const n=ui.rv.nb,it=n.q[n.i];if(n.sel!==null)break;n.sel=+d.i;const ok=n.sel===it.q.a,x=S.notebook.find(y=>y.k===it.k);if(x){if(ok){n.ok++;x.box=Math.min(4,x.box+1);x.due=addDays(today(),INT[x.box])}else{x.box=0;x.due=addDays(today(),1)}}save();render();break}
 case'nbnext':{const n=ui.rv.nb;n.i++;n.sel=null;render();break}
 case'nbend':ui.rv.nb=null;render();break;
 case'nbclear':S.notebook=[];save();render();break;
 case'fcsec':ui.rv.fsec=d.id;render();break;
 case'fcstart':ui.rv.fc={q:dueCards(ui.rv.fsec).slice(0,20).map(c=>c.id),i:0,show:false};render();break;
 case'fcflip':ui.rv.fc.show=true;render();break;
 case'fcgot':{const f=ui.rv.fc,id=f.q[f.i],b=Math.min(4,((S.cards[id]||{}).box||0)+1);S.cards[id]={box:b,due:addDays(today(),INT[b])};f.i++;f.show=false;save();render();break}
 case'fcagain':{const f=ui.rv.fc,id=f.q[f.i];S.cards[id]={box:0,due:addDays(today(),1)};if(f.q.filter(x=>x===id).length<3)f.q.push(id);f.i++;f.show=false;save();render();break}
 case'fcend':ui.rv.fc=null;render();break;
 case'lgadd':{const m=Math.round(+$('#lgmin').value);if(m>0){dayRec().min+=m;S.log.push({d:today(),sub:$('#lgsub').value,min:m});save();toast('Logged '+m+' minutes');render()}break}
 case'swstart':ui.sw={start:Date.now()};render();break;
 case'swstop':{const m=Math.round((Date.now()-ui.sw.start)/60000);ui.sw=null;if(m>0){dayRec().min+=m;S.log.push({d:today(),sub:'Stopwatch',min:m});save();toast('Logged '+m+' minutes')}render();break}
 case'sname':S.name=el.value.trim()||'Abhishek';save();break;
 case'sdate':if(el.value){S.examDate=el.value;S.examSet=true;S.planStart=today();save();render()}break;
 case'shrs':S.hours=+el.value;save();render();break;
 case'spost':S.post=el.value;save();render();break;
 case'bkexp':$('#bk').value=JSON.stringify(S);$('#bk').select();break;
 case'bkimp':{try{const o=JSON.parse($('#bk').value);if(!o||typeof o!=='object'||!o.stats)throw 0;S=Object.assign(defaults(),o);save();toast('Backup restored');render()}catch(e){toast('That text is not a valid backup')}break}
 case'rsask':ui.reset=true;render();break;
 case'rsno':ui.reset=false;render();break;
